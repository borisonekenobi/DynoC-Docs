name: create-sitemap.yml

on: workflow_call

jobs:
  sitemap:
    name: Create Sitemap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run sitemap
