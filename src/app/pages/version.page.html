<div class="guide-container">
	<app-sidebar [layout]="this.sidebarLayout" [version]="this.version"/>

	<section class="guide-content">
		@if (this.released) {
			<router-outlet/>
		} @else {
			<p>
				Still working on it! Check the <a routerLink="/downloads" routerLinkActive="active">Downloads</a> page
				to see if DynoC v{{ this.version }} has been released yet!
			</p>
		}
	</section>
</div>
